# GitHub'a yüklendiğinde APK'yı otomatik oluşturur ve indirme bağlantısı yayınlar.
name: APK Olustur

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AracDenetim-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Indirme baglantisi yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AracDenetim.apk
          gh release delete son-surum --yes --cleanup-tag || true
          gh release create son-surum AracDenetim.apk \
            --title "Arac Denetim Defteri (son surum)" \
            --notes "Telefonda AracDenetim.apk dosyasina dokunup kurun."
