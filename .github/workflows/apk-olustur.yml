# GitHub'a yüklendiğinde APK'yı otomatik oluşturur.
# Actions sekmesi > son çalışma > "AracDenetim-APK" dosyasını indirin.
name: APK Olustur

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AracDenetim-APK
          path: app/build/outputs/apk/debug/app-debug.apk
