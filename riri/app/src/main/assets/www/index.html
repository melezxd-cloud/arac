<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Riri's Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Cinzel:wght@600;700&display=swap">
<style>
:root{--r:20px}
body{margin:0;font-family:Nunito,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .4s}
body.th-flower{--bg:#FFE36E;--card:#FFFFFF;--ink:#3A2A12;--muted:#6B4E12;--title:#3A2A12;--sub:#6B4E12;--accent:#FF4FA3;--accent-d:#C2186F;--on-accent:#FFFFFF;--strong:#B0105F;--soft:#FFE0EF;--soft2:#FFF3B0;--line:#F3E3B0;--field:#FFF9F3;--dash:#FF7EB9;--head:Fredoka,Nunito,sans-serif;--ring:#FFFFFF}
body.th-magic{--bg:#1B1A3A;--card:#F3E6C4;--ink:#3B2A14;--muted:#7A4B12;--title:#F5D98B;--sub:#C9C3E8;--accent:#D4A84B;--accent-d:#8C6A22;--on-accent:#1B1A3A;--strong:#5B2A86;--soft:#FFF8E6;--soft2:#EADCB5;--line:#D4A84B;--field:#FFF8E6;--dash:#D4A84B;--head:Cinzel,Georgia,serif;--ring:#D4A84B}
body.th-night{--bg:#2B1B33;--card:#4A2E57;--ink:#FFE9F4;--muted:#E7C4D8;--title:#FFD0E6;--sub:#E7C4D8;--accent:#FF7EB9;--accent-d:#C2457F;--on-accent:#2B1B33;--strong:#FF9BCB;--soft:#5C3A6B;--soft2:#5A3A60;--line:#6E4A7D;--field:#3A2445;--dash:#FF7EB9;--head:Fredoka,Nunito,sans-serif;--ring:#FF7EB9}
body{background:var(--bg);color:var(--ink)}
*{box-sizing:border-box}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none}
a{color:var(--strong)}
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#view{position:relative;z-index:1;min-height:100vh;padding:16px 16px 110px;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto}
.pg{animation:pg .45s ease-out both}
@keyframes pg{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.4) rotate(-12deg)}70%{transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes zoom{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slideL{from{transform:translateX(-100%)}to{transform:none}}
@keyframes row{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes wob{0%,100%{rotate:-3deg}50%{rotate:3deg}}
.rw{animation:row .35s ease-out both}
.stk{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both,bob 3.2s ease-in-out infinite}
.tw{animation:tw 2.6s ease-in-out infinite}
.sec{animation:tick 1s ease-in-out infinite}
.wob{animation:wob 4s ease-in-out infinite}
body.noanim *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hdr{display:flex;align-items:center;gap:12px}
.mbtn{width:48px;height:48px;flex:none;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 var(--accent-d)}
.ttl{flex:1;min-width:0}
.ttl h1{margin:0;font-family:var(--head);font-weight:700;font-size:23px;line-height:1.15;color:var(--title)}
.ttl p{margin:2px 0 0;font-size:13px;font-weight:700;color:var(--sub)}
.pill{display:flex;flex:none;background:var(--card);border-radius:999px;padding:3px;gap:2px;box-shadow:0 0 0 1.5px var(--line)}
.pill button{width:36px;height:36px;border-radius:999px;font-size:12px;font-weight:800;background:transparent;color:var(--strong)}
.pill button.on{background:var(--accent);color:var(--on-accent)}
.card{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 0 0 2px var(--ring)}
body.th-flower .card{box-shadow:none}
.card h2{margin:0;font-family:var(--head);font-weight:700;font-size:18px;color:var(--ink)}
.muted{font-size:12px;font-weight:700;color:var(--muted)}
.fld{min-height:46px;border-radius:14px;border:2px dashed var(--dash);padding:0 12px;font-size:15px;font-weight:700;background:var(--field);width:100%;min-width:0}
textarea.fld{padding:10px 12px;resize:none}
.btn{min-height:46px;padding:0 16px;border-radius:14px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:800;box-shadow:0 4px 0 var(--accent-d)}
.btn2{min-height:46px;padding:0 16px;border-radius:14px;background:var(--soft);color:var(--strong);font-size:15px;font-weight:800}
.ico{width:40px;height:40px;flex:none;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center}
.row{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--soft2);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:12px;font-size:14px;font-weight:800;background:transparent;color:var(--strong);transition:background .25s,color .25s}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.sw{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:50px;background:none;padding:0;font-size:15px;font-weight:800;text-align:left;gap:10px}
.sw .tr{width:50px;height:28px;flex:none;border-radius:999px;position:relative;background:#D9C9A3;transition:background .25s}
.sw .tr i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .25s cubic-bezier(.3,1.4,.5,1)}
.sw.on .tr{background:var(--accent)}.sw.on .tr i{left:25px}
.fab{position:fixed;right:20px;bottom:24px;z-index:5;width:62px;height:62px;border-radius:22px;background:var(--accent);box-shadow:0 5px 0 var(--accent-d);display:flex;align-items:center;justify-content:center}
.ov{position:fixed;inset:0;z-index:20;background:rgba(30,20,10,.45);display:flex;align-items:center;justify-content:center;padding:22px;animation:fade .2s both}
.mdl{width:100%;max-width:420px;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 5px #fff,0 20px 40px rgba(0,0,0,.35);animation:zoom .35s cubic-bezier(.3,1.4,.5,1) both;color:#3A2A12}
.drw{position:fixed;inset:0;z-index:15;display:flex}
.drw nav{width:300px;max-width:84vw;height:100%;background:var(--card);border-radius:0 32px 32px 0;padding:20px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;box-shadow:8px 0 30px rgba(0,0,0,.3);animation:slideL .35s cubic-bezier(.2,.9,.3,1) both}
.drw .sh{flex:1;background:rgba(30,20,10,.4);animation:fade .3s both}
.mi{display:flex;align-items:center;gap:12px;min-height:50px;border-radius:16px;padding:0 12px;font-size:16px;font-weight:800;background:transparent;color:var(--ink);text-align:left;animation:row .35s ease-out both;width:100%}
.mi.on{background:var(--soft)}
.mi img{width:34px;height:34px;border-radius:9px}
.dot{width:14px;height:14px;border-radius:4px;flex:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:20px;padding:14px;text-align:left;color:var(--ink);box-shadow:0 0 0 2px var(--ring)}
body.th-flower .tile{box-shadow:none}
.bar{height:10px;border-radius:10px;background:var(--soft)}.bar i{display:block;height:10px;border-radius:10px;background:var(--accent);transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.chk{width:26px;height:26px;flex:none;border-radius:8px;border:2.5px solid var(--accent);display:flex;align-items:center;justify-content:center}
.chk.on{background:var(--accent)}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:4px 2px}
.nt{position:relative}
.nt>button.s{width:100%;aspect-ratio:1;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:#3A2A12;position:relative;overflow:hidden}
.nt .x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border-radius:50%;border:3px solid #fff;background:#B0105F;display:flex;align-items:center;justify-content:center;padding:0;z-index:2}
.empty{padding:24px 10px;text-align:center;font-weight:800;color:var(--sub)}
.hero{background:var(--accent);color:var(--on-accent);border-radius:28px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 6px 0 var(--accent-d)}
.u{background:#fff;color:#B0105F;border-radius:16px;width:72px;padding:8px 0;text-align:center}
.u b{display:block;font-family:var(--head);font-size:28px;line-height:1}
.u span{font-size:11px;font-weight:800}
.sr{position:absolute;left:-9999px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#3A2A12;color:#fff;padding:10px 16px;border-radius:999px;font-weight:800;font-size:14px;z-index:30;animation:fade .2s both}
</style>
